name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.12
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov=fundifinder --cov-report=term-missing:skip-covered

  demo:
    name: Browser demo (build and Playwright smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Build the demo site
        run: python3 demo/build.py
      - name: Install test dependencies
        working-directory: demo
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke test the demo
        working-directory: demo
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-failure
          path: demo/smoke-failure.png
          if-no-files-found: ignore

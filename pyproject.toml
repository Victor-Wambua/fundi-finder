[project]
name = "fundi-finder"
version = "0.1.0"
description = "A trust-first marketplace to find and book local artisans (fundis)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0,<4",
    "sqlalchemy>=2.0,<3",
    "pillow>=10.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundifinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:fundifinder.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "C4", "RET", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0911", "PLR0912", "PLR0915", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR", "B011"]
"src/fundifinder/seed.py" = ["S"]

[tool.mypy]
python_version = "3.12"
files = ["src/fundifinder"]
strict = true
warn_unused_ignores = true
disallow_any_generics = false
